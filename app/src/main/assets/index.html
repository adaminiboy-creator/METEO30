<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METEO 30</title><style>body{font:18px system-ui;background:#101c30;color:white;margin:0;padding:22px}select,button{font:inherit;padding:12px;border-radius:10px;margin:5px;background:#24476a;color:white;border:1px solid #6986a0}article{background:#213751;padding:15px;margin:8px 0;border-radius:14px}.muted{color:#afc2d5}#days{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}</style></head><body><h1>☁ METEO 30</h1><select id="place"></select><h2 id="now">Načítavam počasie…</h2><p id="elevation"></p><button onclick="show('forecast')">Predpoveď</button><button onclick="show('radar')">Radar</button><section id="forecast"><h3>16 dní</h3><div id="days"></div></section><section id="radar" hidden><h3>Radar a predpoveď zrážok</h3><p>Radar Windy sa otvorí v prehliadači.</p><button onclick="window.open('https://www.windy.com/-Weather-radar-radar?radar,48.6,19.3,7')">Otvoriť radar Windy</button></section><script>
const cities=[['Zvolenská Slatina',48.57,19.13],['Veľký Lom',48.31,19.48],['Zvolen',48.58,19.13],['Donovaly',48.88,19.23],['Výbohova Poľana',48.53,19.38],['Rožňava',48.66,20.53],['Banská Bystrica',48.74,19.15],['Látky',48.57,19.64]];
const select=document.getElementById('place');cities.forEach((c,i)=>select.add(new Option(c[0],i)));select.onchange=load;
function show(s){document.getElementById('forecast').hidden=s!=='forecast';document.getElementById('radar').hidden=s!=='radar'}
const icons=c=>c===0?'☀️':c<4?'🌤️':c<50?'🌫️':c<70?'🌧️':c<80?'❄️':'⛈️';
async function load(){let c=cities[+select.value];try{const q=new URLSearchParams({latitude:c[1],longitude:c[2],current:'temperature_2m,relative_humidity_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum',forecast_days:16,timezone:'Europe/Bratislava'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+q);if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.getElementById('now').textContent=icons(d.current.weather_code)+' '+d.current.temperature_2m+' °C · '+c[0];document.getElementById('elevation').textContent='Nadmorská výška modelu: '+Math.round(d.elevation)+' m';document.getElementById('days').innerHTML=d.daily.time.map((day,i)=>'<article><b>'+new Intl.DateTimeFormat('sk-SK',{weekday:'long',day:'numeric',month:'numeric'}).format(new Date(day+'T12:00:00'))+'</b><h2>'+icons(d.daily.weather_code[i])+'</h2>'+Math.round(d.daily.temperature_2m_min[i])+' až '+Math.round(d.daily.temperature_2m_max[i])+' °C<br>💧 '+d.daily.precipitation_sum[i]+' mm</article>').join('')}catch(e){document.getElementById('now').textContent='Nepodarilo sa načítať počasie: '+e.message}}
load();
</script></body></html>
